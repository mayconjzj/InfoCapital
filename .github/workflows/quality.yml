name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize formatting and export formatted sources
        shell: bash
        run: |
          npx prettier --write eslint.config.mjs src/app/globals.css src/app/page.tsx tsconfig.json
          for file in eslint.config.mjs src/app/globals.css src/app/page.tsx tsconfig.json; do
            echo "FORMAT_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_FILE_END"
          done

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      - name: Production build
        run: npm run build
